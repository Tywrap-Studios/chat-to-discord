plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

//    // JSON Stuff
//    implementation include("org.json:json:${project.json_version}")
//    // Mclogs Java - Library to read, list and share logs to mclogs
//    implementation include("gs.mclo:api:${project.mclogs_version}")
//    // Jankson
//    implementation include("blue.endless:jankson:${project.jankson_version}")
    // JSON
    implementation "org.json:json:${project.json_version}"
    // Mclogs Java
    implementation "gs.mclo:api:${project.mclogs_version}"
    // Jankson
    implementation "blue.endless:jankson:${project.jankson_version}"
    // BlossomBridge
    implementation("com.github.Tywrap-Studios:BlossomBridge:${project.blossombridge_version}")
    // TODO: Add Spark for AsyncWorldInfoProviderMixin
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

