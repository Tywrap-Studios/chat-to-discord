plugins {
    id("multiloader-common")
    id("net.neoforged.moddev")
}

neoForge {
    neoFormVersion.set(libs.versions.neoform)
    // Automatically enable AccessTransformers if the file exists
    var at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion.set(parchment_minecraft)
        mappingsVersion.set(parchment_version)
    }
}

repositories {
    maven {
        name = "JitPack"
        url = uri("https://jitpack.io")
    }
}

dependencies {
    compileOnly("org.spongepowered:mixin:0.8.5")
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly("io.github.llamalad7:mixinextras-common:0.3.5")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")
    // ASM tree
    compileOnly("org.ow2.asm:asm-tree:9.7.1")
    compileOnly("org.ow2.asm:asm:9.7")

    for (dep in libs.bundles.jijs.get()) {
        implementation(dep)
    }
}

configurations {
    commonJava {
        setCanBeResolved(false)
        setCanBeConsumed(true)
    }
    commonResources {
        setCanBeResolved(false)
        setCanBeConsumed(true)
    }
}

artifacts {
    add("commonJava", sourceSets.main.java.sourceDirectories.singleFile)
    add("commonResources", sourceSets.main.resources.sourceDirectories.singleFile)
}

