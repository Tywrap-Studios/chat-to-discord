plugins {
    id("multiloader-loader")
    id("net.neoforged.moddev")
}

var mod_id = rootProject.property("mod_id").toString()

repositories {
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
    }
    maven {
        name = "JitPack"
        url = uri("https://jitpack.io")
    }
}

dependencies {
    // Spark
    compileOnly("maven.modrinth:spark:${libs.versions.spark}-neoforge")

    for (dep in libs.bundles.jijs.get()) {
        implementation(dep) {
            var map = new HashMap<>()
            map.put("group", "org.slf4j")
            map.put("module", "slf4j-api")
            exclude(map as Map<String, String>)
            var map2 = new HashMap<>()
            map2.put("group", "com.google.code.gson")
            map2.put("module", "gson")
            exclude(map2 as Map<String, String>)
        }
    }

//    // JSON
//    jarJar (implementation (additionalRuntimeClasspath libs.json.get()))
//    // Mclogs Java
//    jarJar (implementation (additionalRuntimeClasspath libs.mclogs.get())) {
//        exclude(group = "com.google.code.gson",) module = "gson"
//    }
//    // Jankson
//    jarJar (implementation (additionalRuntimeClasspath libs.jankson.get()))
//    // BlossomBridge
//    jarJar (implementation (additionalRuntimeClasspath libs.bbapi.get())) {
//        exclude(group = "org.slf4j",) module = "slf4j-api"
//    }

    // Explicit dependencies with compatible versions
    implementation("com.google.code.gson:gson:2.10.1")
    implementation("org.slf4j:slf4j-api:2.0.9")
}

neoForge {
    version.set(rootProject.property("neoforge_version").toString())
    // Automatically enable neoforge AccessTransformers if the file exists
    var at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion.set(parchment_minecraft)
        mappingsVersion.set(parchment_version)
    }
    runs {
        configureEach {
            syste.property("neoforge.enabledGameTestNamespaces", "${mod_id}").toString()
            ideName.set("NeoForge ${it.name.capitalize()} (${project.path})") // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
}