# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.7.0
group=org.tywrapstudios.ctd
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Chat To Discord
mod_author=Tywrap Studios
mod_id=ctd
license=MIT
credits=ItsTiazzz
description=Ah yes, yet another one of the many simplistic mods that allows for one thing: Sending chat messages in a Minecraft server directly to a Discord webhook.
minecraft_version_range=[1.21.1, 1.22)
minecraft_version_range_fabric=~1.21.1
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Common Dependencies
mclogs_version=5.0.2
json_version=20231013
jankson_version=1.2.3
blossombridge_version=master-SNAPSHOT
spark_version=1.10.109

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1024m
org.gradle.daemon=false

# Gradle props
org.gradle.parallel=true

kotlin.incremental=true
ksp.incremental=false
ksp.useKSP2=true